# Configurarea editorului Pages CMS (https://app.pagescms.org).
# Clubul editează conținutul de aici; fiecare salvare republică site-ul în ~2 minute.

media:
  input: media
  output: /media
  rename: safe
  categories: [image]

settings:
  commit:
    identity: user

content:
  - name: stiri
    label: Știri
    type: collection
    path: content/stiri
    format: yaml-frontmatter
    filename: "{year}-{month}-{day}-{fields.titlu}.md"
    view:
      fields: [titlu, data, publicat]
      primary: titlu
      sort: [data, titlu]
      default:
        sort: data
        order: desc
    fields:
      - name: titlu
        label: Titlu
        type: string
        required: true
      - name: data
        label: Data publicării
        type: date
        options:
          time: true
          format: "yyyy-MM-dd'T'HH:mm"
      - name: rezumat
        label: Rezumat
        type: text
        description: O frază scurtă, apare pe pagina principală și în lista de știri.
        options:
          maxlength: 300
      - name: imagine
        label: Poză principală
        type: image
      - name: publicat
        label: Publicat
        type: boolean
        default: true
        description: Debifați ca să ascundeți știrea fără să o ștergeți.
      - name: body
        label: Text
        type: rich-text
        options:
          format: markdown

  - name: primul11
    label: Primul 11
    type: file
    path: content/primul11.yml
    format: yaml
    # Echipa apare pe site imediat după Save și dispare singură după ce meciul s-a jucat.
    fields:
      # >>> LISTA JUCĂTORI – generată automat la fiecare sincronizare (export_players). Nu editați manual.
      - name: meci
        label: "Meciul"
        type: select
        required: true
        description: "Echipa apare pe site pentru acest meci și dispare singură după ce s-a jucat."
        options:
          placeholder: Alegeți meciul
          values:
            - { name: "10", label: "Etapa 10 · CSC Belinț – CS Sânandrei Timiș · sâm 24.10, 16:00" }
            - { name: "11", label: "Etapa 11 · CS Sânandrei Timiș – Club Sportiv Giroc-Chisoda · dată neanunțată" }
