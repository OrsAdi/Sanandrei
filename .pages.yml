  - name: jucatori
    label: Jucători
    type: collection
    path: content/jucatori
    format: yaml
    # Jucătorii sunt creați automat din lotul de pe frf-ajf.ro.
    operations:
      create: false
      rename: false
      delete: false
    view:
      fields: [numar, nume, pozitie, in_lot]
      primary: nume
      sort: [numar, nume]
      default:
        sort: numar
        order: asc
    fields:
      - name: nume
        label: Nume (de pe FRF)
        type: string
        readonly: true
      - name: frf_id
        label: ID FRF
        type: number
        readonly: true
      - name: in_lot
        label: În lotul oficial FRF
        type: boolean
        readonly: true
      - name: numar
        label: Număr pe tricou
        type: number
      - name: pozitie
        label: Post
        type: select
        options:
          values:
            - { name: Portar, label: Portar }
            - { name: Fundaș, label: Fundaș }
            - { name: Mijlocaș, label: Mijlocaș }
            - { name: Atacant, label: Atacant }
      - name: poza
        label: Poză
        type: image
      - name: descriere
        label: Despre jucător
        type: text

  - name: produse
    label: Magazin
    type: collection
    path: content/produse
    format: yaml-frontmatter
    filename: "{fields.nume}.md"
    view:
      fields: [nume, pret, in_stoc, activ]
      primary: nume
    fields:
      - name: nume
        label: Nume produs
        type: string
        required: true
      - name: categorie
        label: Categorie
        type: string
        description: Ex. Echipament, Suveniruri. Produsele cu aceeași categorie sunt grupate.
      - name: pret
        label: Preț (lei)
        type: number
        required: true
      - name: imagine
        label: Poză
        type: image
      - name: marimi
        label: Mărimi
        type: string
        list: true
        description: Lăsați gol dacă produsul nu are mărimi (ex. fular).
      - name: in_stoc
        label: În stoc
        type: boolean
        default: true
      - name: activ
        label: Afișat pe site
        type: boolean
        default: true
      - name: body
        label: Descriere
        type: rich-text
        options:
          format: markdown

  - name: sponsori
    label: Sponsori
    type: file
    path: content/sponsori.yml
    format: yaml
    list: true
    fields:
      - name: nume
        label: Nume
        type: string
        required: true
      - name: logo
        label: Logo
        type: image
      - name: site
        label: Site web
        type: string

  - name: setari
    label: Setări site
    type: file
    path: content/setari.yml
    format: yaml
    fields:
      - name: email
        label: Email club
        type: string
        description: Apare pe site; formularele de contact și comenzile ajung la adresa setată în Web3Forms.
      - name: telefon
        label: Telefon
        type: string
      - name: stadion
        label: Adresa stadionului
        type: string
      - name: despre
        label: Despre club (subsol)
        type: text
      - name: facebook
        label: Link Facebook
        type: string
      - name: instagram
        label: Link Instagram
        type: string
