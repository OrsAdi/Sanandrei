{% load l10n %}{% localize off %}
{% if chart %}
<div class="table-wrap">
<svg class="chart" viewBox="0 0 {{ chart.width }} {{ chart.height }}" width="100%" role="img" aria-label="Evoluția locului în clasament pe etape" style="min-width:420px">
  {% for g in chart.gridlines %}
    <line x1="{{ chart.pad }}" x2="{{ chart.right }}" y1="{{ g.y }}" y2="{{ g.y }}" stroke="#e7e8ec" stroke-dasharray="4 4"/>
    <text x="4" y="{{ g.y }}" dy="4">{{ g.pos }}</text>
  {% endfor %}
  <polyline points="{{ chart.polyline }}" fill="none" stroke="#f26a1b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
  {% for p in chart.points %}
    <circle cx="{{ p.x }}" cy="{{ p.y }}" r="5" fill="#fff" stroke="#f26a1b" stroke-width="2.5"><title>Etapa {{ p.round }}: locul {{ p.position }}, {{ p.points }} puncte</title></circle>
    <text x="{{ p.x }}" y="{{ p.y }}" dy="-10" text-anchor="middle" style="fill:#16181d;font-weight:700">{{ p.position }}</text>
    <text x="{{ p.x }}" y="{{ chart.bottom }}" text-anchor="middle">E{{ p.round }}</text>
  {% endfor %}
</svg>
</div>
{% endif %}
{% endlocalize %}
