{% extends "base.html" %}
{% block title %}Caută{% endblock %}
{% block hero %}<section class="page-hero"><div class="container"><div class="eyebrow">{{ COMPETITION_NAME }}</div><h1>Caută jucători și echipe</h1></div></section>{% endblock %}
{% block content %}
<form class="search-form card" data-search role="search">
  <input class="input" type="search" name="q" placeholder="Nume jucător sau echipă (min. 2 litere)" autofocus autocomplete="off">
  <button class="btn" type="submit">Caută</button>
</form>
<div class="grid grid-2 mt" data-search-results hidden>
  <div class="card">
    <h3>Jucători (<span data-count="players">0</span>)</h3>
    <div data-list="players"></div>
  </div>
  <div class="card">
    <h3>Echipe (<span data-count="teams">0</span>)</h3>
    <div data-list="teams"></div>
  </div>
</div>
{% endblock %}
{% block scripts %}{{ index|json_script:"search-index" }}{% endblock %}
