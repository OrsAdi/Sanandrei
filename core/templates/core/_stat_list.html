{% if rows %}<ul class="st-list">{% for r in rows|slice:":5" %}<li><span class="pill pill-{{ r.result }}">{{ r.result }}</span><span class="st-opp">{% if r.home %}vs{% else %}la{% endif %} {{ r.opponent.name }}</span><b>{{ r.score }}</b></li>{% endfor %}</ul>{% if rows|length > 5 %}<p class="st-line">și încă {{ rows|length|add:"-5" }}</p>{% endif %}{% else %}<p class="st-line">{{ empty }}</p>{% endif %}
